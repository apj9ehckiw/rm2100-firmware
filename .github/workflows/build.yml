name: Build RM AC2100 OpenWrt firmware

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt release to build from"
        required: false
        default: "24.10.2"
      include_luci:
        description: "Include LuCI web UI (true/false)"
        required: false
        default: "true"
      fw_version:
        description: "Firmware version stamp (written to /etc/campus-fix-version and artifact name)"
        required: false
        default: "2.5.0"

env:
  PROFILE: xiaomi_redmi-router-ac2100
  TARGET: ramips/mt7621

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils zstd ca-certificates

      - name: Download OpenWrt ImageBuilder
        run: |
          VER="${{ github.event.inputs.openwrt_version || '24.10.2' }}"
          URL="https://downloads.openwrt.org/releases/${VER}/targets/${TARGET}/openwrt-imagebuilder-${VER}-ramips-mt7621.Linux-x86_64.tar.zst"
          echo "Downloading: $URL"
          curl -fL --retry 3 -o imagebuilder.tar.zst "$URL"
          tar --zstd -xf imagebuilder.tar.zst
          mv "openwrt-imagebuilder-${VER}-ramips-mt7621.Linux-x86_64" ib

      - name: Include custom files overlay
        run: |
          mkdir -p ib/files
          cp -r files/* ib/files/
          # stamp the firmware version into the overlay
          FWV="${{ github.event.inputs.fw_version || '2.5.0' }}"
          echo "$FWV" > ib/files/etc/campus-fix-version
          sed -i "s|^echo \".*\" > /etc/campus-fix-version|echo \"$FWV\" > /etc/campus-fix-version|"             ib/files/etc/uci-defaults/99-campus-fix-banner
          echo "firmware version: $FWV"

      - name: Fetch third-party packages (luci-theme-argon)
        run: |
          # Argon is not in the official 24.10 luci feed (only bootstrap/
          # material/openwrt are). Pull the release ipk from upstream; it is
          # arch-independent (_all) and ucode-based, verified compatible with
          # 24.10 LuCI. Place it where ImageBuilder picks up local packages.
          mkdir -p ib/packages/local
          curl -fL --retry 3 -o ib/packages/local/luci-theme-argon_2.4.7_all.ipk \
            "https://github.com/jerrykuku/luci-theme-argon/releases/download/v2.4.7/luci-theme-argon_2.4.7_all.ipk"
          ls -la ib/packages/local/

      - name: Validate custom nftables rules
        run: |
          # nft -c catches syntax errors (e.g. the v2.2.0 'hash' vs
          # 'jhash' bug) BEFORE they brick fw4 on first boot.
          sudo apt-get install -y nftables
          shopt -s nullglob
          rc=0
          for f in ib/files/etc/nftables.d/*.nft; do
            echo "checking $f"
            # wrap drop-in chains in a scratch table so standalone chain
            # blocks parse. Run inside a fresh network namespace with
            # CAP_NET_ADMIN: nft still opens a netlink socket even with -c,
            # which plain CI runners deny.
            { echo "table inet fw4check {"; cat "$f"; echo "}"; } > /tmp/check.nft
            if ! sudo unshare --net nft -c -f /tmp/check.nft; then
              echo "SYNTAX ERROR in $f" >&2
              rc=1
            fi
          done
          exit $rc

      - name: Build firmware
        working-directory: ib
        run: |
          PKGS=""
          if [ "${{ github.event.inputs.include_luci || 'true' }}" = "true" ]; then
            PKGS="luci"
            # Argon theme (from local packages/ dir) + Simplified Chinese
            # UI. base-zh-cn covers luci-base/mod-*; the other two cover
            # the bundled apps. luci-i18n auto-lang: uci-defaults below
            # sets zh-cn as default.
            PKGS="$PKGS luci-theme-argon luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn"
          fi
          PKGS="$PKGS kmod-ipt-nat ip6tables-nft iptables-nft"
          make image \
            PROFILE="$PROFILE" \
            PACKAGES="$PKGS" \
            FILES=files/

      - name: List artifacts
        run: find ib/bin/targets -type f \( -name "*.bin" -o -name "*.manifest" -o -name "sha256sums" \) -exec ls -lh {} \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rm2100-firmware-v${{ github.event.inputs.fw_version || '2.5.0' }}-openwrt-${{ github.event.inputs.openwrt_version || '24.10.2' }}
          path: |
            ib/bin/targets/*/*/openwrt-*-xiaomi_redmi-router-ac2100-squashfs-kernel1.bin
            ib/bin/targets/*/*/openwrt-*-xiaomi_redmi-router-ac2100-squashfs-rootfs0.bin
            ib/bin/targets/*/*/openwrt-*-xiaomi_redmi-router-ac2100-squashfs-sysupgrade.bin
            ib/bin/targets/*/*/openwrt-*-xiaomi_redmi-router-ac2100-initramfs-kernel.bin
            ib/bin/targets/*/*/*.manifest
            ib/bin/targets/*/*/sha256sums
          retention-days: 30
